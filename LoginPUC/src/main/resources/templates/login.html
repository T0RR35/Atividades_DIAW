<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <div class="login-container">
        <img th:src="@{images/apc-login-bg.png}" alt="Logo PUC Minas">
    </div>
    <div class="login-form">
        <form th:action="@{/login}" method="post" class="login-form">
            <h4 class="login-title">Login</h4>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="text" id="password" name="password" placeholder="Senha" required>
            <div class="login-button-container">
                <button type="submit">Entrar</button>
            </div>
        </form>
        <p class="login-redirect-options">Ainda não tem cadastro?<br>
            <a href="/register">Cadastre-se</a>
            <a href="/recoverpassword">Esqueceu a senha?</a>
        </p>
    </div>
</body>
</html>
