<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<!--- 

TIVE QUE FAZER A PROVA EM 50 MINUTOS, MEU NOTEBOOK ESTAVA DANDO PROBLEMA DURANTE METADE DO TEMPO DA PROVA.

-->

<body>
    <hr>

    <main class="container mt-4">

        <section class="text-center mb-5">

            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

                <div class="col" th:each="candidato : ${candidatos}">
                    <div class="card h-100 shadow-sm">

                        <img th:src="@{'/images/candidatos/FMG' + ${candidato.sqCandidato} + '_div.jpg'}"
                            class="card-img-top candidato-card-img">

                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">
                                <p th:text="${candidato.nomeCandidato}"></p>
                            </h5>
                            <p class="card-text text-muted">
                            <p th:text="${candidato.cargo}"></p>
                            </p>
                            <p class="fs-4 text-success fw-bold mt-auto">
                            <p th:text="${candidato.nrCandidato}"></p>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</body>

</html>
